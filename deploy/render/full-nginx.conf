pid /tmp/playeon-nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  proxy_buffering off;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_upgrade $room_backend { default http://127.0.0.1:3000; ~*websocket http://127.0.0.1:3067; }
  server {
    listen __PORT__;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    location = /health { proxy_pass http://127.0.0.1:3001; }
    # /room is BOTH a Next page (HTTP) and the room socket (WebSocket).
    location = /room { proxy_pass $room_backend; }
    location ~ ^/(preview|logo|video|media|avatar)(/|$) { proxy_pass http://127.0.0.1:3067; }
    location / { proxy_pass http://127.0.0.1:3000; }
  }
}

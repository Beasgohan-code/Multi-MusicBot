# Full Playeon browser bot + WebApp on ONE Render service and ONE public URL.
# Paid service/disk; personal non-commercial testing under preserved upstream license.
services:
  - type: web
    name: multimusicbot-full
    runtime: docker
    plan: starter
    numInstances: 1
    autoDeploy: false
    dockerfilePath: ./Dockerfile.bot
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: playeon-session
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: DEV_IDS
        sync: false
      - key: ROOM_JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: playeon_test
      - key: REDIS_URL
        sync: false
      - key: SESSION_NAME
        value: /var/data/playeon-session
